name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "native/android/**"
      - "scripts/prepare-android.mjs"
      - "scripts/generate-update-manifest.mjs"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Run web regressions
        run: npm test

      - name: Build static web bundle
        run: npm run build

      - name: Verify native static entrypoints
        run: |
          test -f out/index.html
          test -f out/share.html
          test -f out/update/latest.json

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Prepare beta signing directory
        run: mkdir -p ~/.android

      - name: Restore beta signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: water-sort-solver-debug-keystore-v2

      - name: Create beta signing key when absent
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Water Sort Solver Beta,O=octoteo,C=CN"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage rolling APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Water-Sort-Solver.apk

      - name: Generate signed update metadata
        run: node scripts/generate-update-manifest.mjs Water-Sort-Solver.apk latest.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-sort-solver-android-debug
          path: |
            Water-Sort-Solver.apk
            latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest Water-Sort-Solver.apk latest.json \
            --target "$GITHUB_SHA" \
            --title "Water Sort Solver Android v${VERSION}" \
            --notes "Android rolling build. v${VERSION} adds a China-friendly Gitee mirror with automatic GitHub fallback and SHA-256 verification." \
            --latest

      - name: Publish China update mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN is required for the China update mirror."
            exit 1
          fi

          VERSION=$(node -p "require('./package.json').version")
          rm -rf gitee-mirror
          mkdir gitee-mirror
          cp Water-Sort-Solver.apk latest.json gitee-mirror/
          cat > gitee-mirror/README.md <<EOF
          # Water Sort Solver Android

          本仓库仅用于 Water Sort Solver Android APK 的中国大陆下载镜像，不是源码仓库。

          - 当前镜像版本：v${VERSION}
          - APK：Water-Sort-Solver.apk
          - 更新元数据：latest.json
          - 源码：https://github.com/octoteo/water-sort-solver

          APK 由 GitHub Actions 自动构建并同步；应用会校验 latest.json 中记录的 SHA-256。
          EOF

          cd gitee-mirror
          git init --initial-branch=main
          git config user.name "water-sort-solver-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md Water-Sort-Solver.apk latest.json
          git commit -m "release: Android v${VERSION}"
          git remote add origin "https://octoteo:${GITEE_TOKEN}@gitee.com/octoteo/water-sort-solver-android.git"
          GIT_TERMINAL_PROMPT=0 timeout 180s git push --force origin HEAD:refs/heads/main

      - name: Verify public Gitee update mirror
        run: |
          set -eu
          GITEE_META="https://gitee.com/octoteo/water-sort-solver-android/raw/main/latest.json"
          GITEE_APK="https://gitee.com/octoteo/water-sort-solver-android/raw/main/Water-Sort-Solver.apk"
          EXPECTED_SHA=$(node -p "require('./latest.json').sha256")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          VERIFIED=0

          for attempt in 1 2 3 4 5; do
            rm -f gitee-latest.json gitee-apk.bin
            if curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 120 \
                 -A "WaterSortSolver-Android/0.8" \
                 -H "Accept: application/json,*/*" \
                 -o gitee-latest.json "$GITEE_META" && \
               curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 180 \
                 -A "WaterSortSolver-Android/0.8" \
                 -H "Accept: application/vnd.android.package-archive,*/*" \
                 -o gitee-apk.bin "$GITEE_APK"; then
              REMOTE_SHA=$(sha256sum gitee-apk.bin | awk '{print $1}')
              REMOTE_META_SHA=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('gitee-latest.json','utf8')).sha256 || '')")
              REMOTE_VERSION=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('gitee-latest.json','utf8')).versionName || '')")
              if [ "$REMOTE_SHA" = "$EXPECTED_SHA" ] && [ "$REMOTE_META_SHA" = "$EXPECTED_SHA" ] && [ "$REMOTE_VERSION" = "$LOCAL_VERSION" ]; then
                echo "Verified Gitee mirror v${LOCAL_VERSION}, sha256=${EXPECTED_SHA}"
                VERIFIED=1
                break
              fi
              echo "::warning::Gitee mirror is reachable but has not converged yet (attempt ${attempt}/5)."
            else
              echo "::warning::Gitee mirror download failed (attempt ${attempt}/5)."
            fi
            sleep $((attempt * 5))
          done

          if [ "$VERIFIED" -ne 1 ]; then
            echo "::error::Gitee mirror could not be verified after publishing."
            exit 1
          fi

# Mirror verification is intentionally part of the release gate.
