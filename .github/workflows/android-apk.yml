name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "native/android/**"
      - "scripts/prepare-android.mjs"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Run web regressions
        run: npm test

      - name: Build static web bundle
        run: npm run build

      - name: Verify native static entrypoints
        run: |
          test -f out/index.html
          test -f out/share.html

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Keep beta signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: water-sort-solver-debug-keystore-v1

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-sort-solver-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
