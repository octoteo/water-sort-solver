name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "native/android/**"
      - "scripts/prepare-android.mjs"
      - "scripts/generate-update-manifest.mjs"
      - "scripts/publish-gitee-release.mjs"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Run web regressions
        run: npm test

      - name: Build static web bundle
        run: npm run build

      - name: Verify native static entrypoints
        run: |
          test -f out/index.html
          test -f out/share.html
          test -f out/update/latest.json

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Prepare beta signing directory
        run: mkdir -p ~/.android

      - name: Restore beta signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: water-sort-solver-debug-keystore-v2

      - name: Create beta signing key when absent
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Water Sort Solver Beta,O=octoteo,C=CN"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage rolling APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Water-Sort-Solver.apk

      - name: Generate signed update metadata
        run: node scripts/generate-update-manifest.mjs Water-Sort-Solver.apk latest.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-sort-solver-android-debug
          path: |
            Water-Sort-Solver.apk
            latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          EXPECTED_SHA=$(node -p "require('./latest.json').sha256")

          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" Water-Sort-Solver.apk latest.json \
            --target "$GITHUB_SHA" \
            --title "Water Sort Solver Android v${VERSION}" \
            --notes "Android release v${VERSION}. APK bytes are shared with the Gitee mirror and verified against the generated SHA-256." \
            --latest

          rm -f github-apk.bin
          gh release download "$TAG" -p Water-Sort-Solver.apk -O github-apk.bin
          ACTUAL_SHA=$(sha256sum github-apk.bin | awk '{print $1}')
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Verified GitHub release ${TAG}, sha256=${ACTUAL_SHA}"

      - name: Publish verified GitHub discovery release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_SHA=$(node -p "require('./latest.json').sha256")

          # Keep this stable tag for older installed builds. It is published only
          # after the immutable/versioned release above has been downloaded and
          # verified, so it can never advertise bytes that do not yet exist.
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest Water-Sort-Solver.apk latest.json \
            --target "$GITHUB_SHA" \
            --title "Water Sort Solver Android v${VERSION}" \
            --notes "Compatibility discovery release for installed Android builds. The manifest points to the verified versioned release." \
            --latest

          rm -f github-rolling-apk.bin
          gh release download android-latest -p Water-Sort-Solver.apk -O github-rolling-apk.bin
          ROLLING_SHA=$(sha256sum github-rolling-apk.bin | awk '{print $1}')
          test "$ROLLING_SHA" = "$EXPECTED_SHA"
          echo "Verified GitHub discovery release android-latest, sha256=${ROLLING_SHA}"

      - name: Publish China update mirror to Gitee OpenAPI
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/publish-gitee-release.mjs

# Gitee OpenAPI is used because git smart-HTTP push from GitHub-hosted runners can time out.
