name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "public/**"
      - "tests/**"
      - "native/android/**"
      - "scripts/prepare-android.mjs"
      - "scripts/generate-update-manifest.mjs"
      - "scripts/publish-gitee-release.mjs"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "tsconfig.json"
      - "package.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk-main
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install

      - name: Run web regressions
        run: npm test

      - name: Build static web bundle
        run: npm run build

      - name: Verify native static entrypoints
        run: |
          test -f out/index.html
          test -f out/share.html
          test -f out/update/latest.json

      - name: Generate Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/prepare-android.mjs

      - name: Prepare beta signing directory
        run: mkdir -p ~/.android

      - name: Restore beta signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: water-sort-solver-debug-keystore-v2

      - name: Create beta signing key when absent
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Water Sort Solver Beta,O=octoteo,C=CN"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage rolling APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Water-Sort-Solver.apk

      - name: Generate signed update metadata
        run: node scripts/generate-update-manifest.mjs Water-Sort-Solver.apk latest.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: water-sort-solver-android-debug
          path: |
            Water-Sort-Solver.apk
            latest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest Water-Sort-Solver.apk latest.json \
            --target "$GITHUB_SHA" \
            --title "Water Sort Solver Android v${VERSION}" \
            --notes "Android rolling build. v${VERSION} adds a China-friendly Gitee mirror with automatic GitHub fallback and SHA-256 verification." \
            --latest

      - name: Publish China update mirror to Gitee OpenAPI
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: node scripts/publish-gitee-release.mjs

      - name: Verify public Gitee update mirror
        run: |
          set -eu
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          GITEE_APK="https://gitee.com/octoteo/water-sort-solver-android/releases/download/v${LOCAL_VERSION}/Water-Sort-Solver.apk"
          EXPECTED_SHA=$(node -p "require('./latest.json').sha256")
          VERIFIED=0

          for BRANCH in main master; do
            GITEE_META="https://gitee.com/octoteo/water-sort-solver-android/raw/${BRANCH}/latest.json"
            for attempt in 1 2 3 4 5; do
              rm -f gitee-latest.json gitee-apk.bin
              if curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 120 \
                   -A "WaterSortSolver-Android/0.8" \
                   -H "Accept: application/json,*/*" \
                   -o gitee-latest.json "$GITEE_META" && \
                 curl -fsSL --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 180 \
                   -A "WaterSortSolver-Android/0.8" \
                   -H "Accept: application/vnd.android.package-archive,*/*" \
                   -o gitee-apk.bin "$GITEE_APK"; then
                REMOTE_SHA=$(sha256sum gitee-apk.bin | awk '{print $1}')
                REMOTE_META_SHA=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('gitee-latest.json','utf8')).sha256 || '')")
                REMOTE_VERSION=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('gitee-latest.json','utf8')).versionName || '')")
                if [ "$REMOTE_SHA" = "$EXPECTED_SHA" ] && [ "$REMOTE_META_SHA" = "$EXPECTED_SHA" ] && [ "$REMOTE_VERSION" = "$LOCAL_VERSION" ]; then
                  echo "Verified Gitee mirror v${LOCAL_VERSION} on branch ${BRANCH}, sha256=${EXPECTED_SHA}"
                  VERIFIED=1
                  break 2
                fi
                echo "::warning::Gitee mirror is reachable but has not converged yet (branch ${BRANCH}, attempt ${attempt}/5)."
              else
                echo "::warning::Gitee mirror download failed (branch ${BRANCH}, attempt ${attempt}/5)."
              fi
              sleep $((attempt * 5))
            done
          done

          if [ "$VERIFIED" -ne 1 ]; then
            echo "::error::Gitee mirror could not be verified after publishing."
            exit 1
          fi

# Gitee OpenAPI is used because git smart-HTTP push from GitHub-hosted runners can time out.
